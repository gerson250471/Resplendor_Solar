<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resplendor Solar - Área do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Reseta o padrão do navegador para tela cheia perfeita */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0f172a;
        font-family: "Inter", sans-serif;
      }

      .hero-banner {
        background:
          linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)),
          url("https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&q=80&w=1920");
        background-size: cover;
        background-position: center;
      }

      /* A caixa de contenção (A Máscara do Sistema) - Começa escondida */
      .mascara-iframe {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
        display: none;
      }

      /* O Sistema empurrado 36 pixels para cima para cortar o banner do Google */
      .mascara-iframe iframe {
        position: absolute;
        top: -40px; /* Mudou de -36px para -48px */
        left: 0;
        width: 100%;
        height: calc(100% + 40px); /* Mudou de 36px para 48px */
        border: none;
      }
    </style>
  </head>
  <body class="text-white relative overflow-hidden">
    <div
      id="faixa-homologacao"
      class="fixed top-0 left-0 w-full bg-orange-600 text-white text-center text-[10px] sm:text-xs font-bold py-1 z-[9999] tracking-widest hidden shadow-md"
    >
      ⚠️ AMBIENTE DE HOMOLOGAÇÃO - MAJB SISTEMAS ⚠️
    </div>

    <div
      id="tela-apresentacao"
      class="w-full h-full min-h-screen flex flex-col items-center justify-center relative overflow-y-auto"
    >
      <div class="hero-banner absolute inset-0 z-0"></div>

      <div
        class="relative z-10 text-center px-4 max-w-3xl flex-1 flex flex-col justify-center items-center"
      >
        <div
          class="mb-6 inline-flex p-3 bg-amber-500 rounded-2xl shadow-lg shadow-amber-500/20"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"
            />
          </svg>
        </div>

        <h1 class="text-5xl md:text-6xl font-extrabold mb-4 tracking-tight">
          Algo Brilhante está <span class="text-amber-500">Chegando.</span>
        </h1>

        <p class="text-lg md:text-xl text-slate-300 mb-10">
          Estamos preparando a plataforma de gestão de energia solar mais
          completa da região. Transparência e tecnologia para a sua economia.
        </p>

        <div
          class="flex flex-col md:flex-row gap-4 justify-center w-full md:w-auto"
        >
          <button
            onclick="abrirSistema()"
            class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-4 px-8 rounded-full transition-all transform hover:scale-105 flex items-center justify-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                clip-rule="evenodd"
              />
            </svg>
            ÁREA EXCLUSIVA DO CLIENTE
          </button>

          <a
            href="https://wa.me/5512999999999"
            target="_blank"
            class="bg-white/10 hover:bg-white/20 backdrop-blur-md text-white font-semibold py-4 px-8 rounded-full transition-all border border-white/20 flex items-center justify-center gap-2"
          >
            FALAR COM CONSULTOR
          </a>
        </div>
      </div>

      <footer
        class="relative z-10 pb-8 text-slate-400 text-sm text-center w-full"
      >
        &copy; 2026 Resplendor Solar. Desenvolvido por MAJB Sistemas.
      </footer>
    </div>

    <div id="tela-sistema" class="mascara-iframe">
      <iframe id="meu-iframe" src="" title="Sistema Resplendor Solar"></iframe>
    </div>

    <script>
      function abrirSistema() {
        // 1. Esconde a landing page
        document.getElementById("tela-apresentacao").style.display = "none";

        // 2. Coloca o link do Google Script no iframe
        const linkGoogleScript = "COLOQUE_SEU_LINK_AQUI"; // Mantenha o seu link real aqui
        document.getElementById("meu-iframe").src = linkGoogleScript;

        // 3. Seleciona o container do sistema
        const telaSistema = document.getElementById("tela-sistema");

        // 4. Mostra o iframe e a faixa
        telaSistema.style.display = "block";
        document.getElementById("faixa-homologacao").style.display = "block";

        // 5. CORREÇÃO: Empurra o container para baixo da faixa e ajusta a altura
        telaSistema.style.marginTop = "28px";
        telaSistema.style.height = "calc(100vh - 28px)";
      }
    </script>
  </body>
</html>
