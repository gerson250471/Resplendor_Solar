<section id="view-tarefas" class="page-view hidden h-full flex flex-col">
  <div class="flex justify-between items-center mb-6 shrink-0">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Quadro de Processos</h2>
      <p class="text-slate-500 text-sm">
        Arraste os cartões para avançar as etapas.
      </p>
    </div>
    <button
      onclick="abrirModalTarefa()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 shadow-md flex items-center gap-2"
    >
      <i data-lucide="plus" class="w-4 h-4"></i> Novo Cartão
    </button>
  </div>

  <div class="flex gap-6 overflow-x-auto pb-4 flex-1 items-start">
    <div
      class="bg-slate-100 rounded-xl w-80 shrink-0 flex flex-col max-h-full border border-slate-200"
    >
      <div
        class="p-3 border-b border-slate-200 flex justify-between items-center bg-slate-200/50 rounded-t-xl"
      >
        <h3 class="font-bold text-slate-700">A Fazer</h3>
        <span
          id="count-todo"
          class="bg-slate-300 text-slate-700 text-xs px-2 py-1 rounded-full font-bold"
          >0</span
        >
      </div>
      <div
        id="col-A FAZER"
        class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[200px]"
        ondragover="allowDrop(event)"
        ondrop="dropTarefa(event, 'A FAZER')"
      ></div>
    </div>

    <div
      class="bg-blue-50 rounded-xl w-80 shrink-0 flex flex-col max-h-full border border-blue-100"
    >
      <div
        class="p-3 border-b border-blue-100 flex justify-between items-center bg-blue-100/50 rounded-t-xl"
      >
        <h3 class="font-bold text-blue-800">Em Andamento</h3>
        <span
          id="count-doing"
          class="bg-blue-200 text-blue-800 text-xs px-2 py-1 rounded-full font-bold"
          >0</span
        >
      </div>
      <div
        id="col-EM ANDAMENTO"
        class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[200px]"
        ondragover="allowDrop(event)"
        ondrop="dropTarefa(event, 'EM ANDAMENTO')"
      ></div>
    </div>

    <div
      class="bg-emerald-50 rounded-xl w-80 shrink-0 flex flex-col max-h-full border border-emerald-100"
    >
      <div
        class="p-3 border-b border-emerald-100 flex justify-between items-center bg-emerald-100/50 rounded-t-xl"
      >
        <h3 class="font-bold text-emerald-800">Concluído</h3>
        <span
          id="count-done"
          class="bg-emerald-200 text-emerald-800 text-xs px-2 py-1 rounded-full font-bold"
          >0</span
        >
      </div>
      <div
        id="col-CONCLUIDO"
        class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[200px]"
        ondragover="allowDrop(event)"
        ondrop="dropTarefa(event, 'CONCLUIDO')"
      ></div>
    </div>
  </div>
</section>

<div
  id="modal-tarefa"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10005] flex items-center justify-center backdrop-blur-sm p-4"
>
  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative">
    <h3 id="titulo-modal-tarefa" class="text-xl font-bold text-slate-800 mb-4">
      Novo Cartão
    </h3>
    <input type="hidden" id="tar-linha" />

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Título / Processo</label
        >
        <input
          type="text"
          id="tar-titulo"
          class="input-field font-bold text-slate-800"
          placeholder="Ex: Solicitar inversor para o cliente X"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Descrição Detalhada</label
        >
        <textarea
          id="tar-descricao"
          rows="4"
          class="input-field resize-none text-sm"
          placeholder="Anotações, links, ou detalhes do processo..."
        ></textarea>
      </div>
    </div>

    <div
      class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100"
    >
      <button
        id="btn-excluir-tarefa"
        onclick="excluirTarefa()"
        class="text-red-500 hover:bg-red-50 p-2 rounded transition-colors hidden"
        title="Excluir Cartão"
      >
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>

      <div class="flex gap-2 ml-auto">
        <button
          onclick="fecharModalTarefa()"
          class="bg-slate-100 px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200"
        >
          Cancelar
        </button>
        <button
          onclick="salvarTarefa()"
          class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-white shadow-md hover:bg-blue-700"
        >
          Salvar Cartão
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let tarefasGlobais = [];

  function carregarQuadroKanban() {
    mostrarToast("Carregando quadro...", "info");
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          tarefasGlobais = res.dados;
          renderizarQuadro();
        } else {
          // Se o servidor negar os dados, exibe um alerta vermelho em vez de travar
          mostrarToast(
            "Erro ao carregar: " + (res ? res.mensagem : "Falha na conexão"),
            "erro",
          );
        }
      })
      .withFailureHandler((err) => {
        // Se a internet falhar ou o Google engasgar, o sistema avisa
        mostrarToast("Erro crítico de comunicação: " + err.message, "erro");
      })
      .obterTarefas();
  }

  function renderizarQuadro() {
    // Limpa as colunas
    document.getElementById("col-A FAZER").innerHTML = "";
    document.getElementById("col-EM ANDAMENTO").innerHTML = "";
    document.getElementById("col-CONCLUIDO").innerHTML = "";

    let cTodo = 0,
      cDoing = 0,
      cDone = 0;

    tarefasGlobais.forEach((t) => {
      const status = t.status.toUpperCase();
      let divId = "col-A FAZER";

      if (status === "EM ANDAMENTO") {
        divId = "col-EM ANDAMENTO";
        cDoing++;
      } else if (status === "CONCLUIDO") {
        divId = "col-CONCLUIDO";
        cDone++;
      } else {
        cTodo++;
      }

      const card = document.createElement("div");
      card.className =
        "bg-white p-3 rounded-lg shadow-sm border border-slate-200 cursor-grab hover:shadow-md transition-shadow relative group active:cursor-grabbing";
      card.draggable = true;
      card.id = "card-" + t.linha;
      card.ondragstart = (e) => dragStart(e, t.linha);

      // Ícone de lápis que aparece ao passar o mouse
      card.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <span class="text-[10px] font-mono text-slate-400 font-bold">${t.id}</span>
          <button onclick="editarTarefa(${t.linha})" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-blue-600 transition-opacity">
            <i data-lucide="edit-2" class="w-4 h-4"></i>
          </button>
        </div>
        <h4 class="text-sm font-bold text-slate-800 mb-1 leading-tight">${t.titulo}</h4>
        ${t.descricao ? `<p class="text-xs text-slate-500 line-clamp-2">${t.descricao}</p>` : ""}
        <div class="mt-3 text-[10px] text-slate-400 font-medium flex items-center gap-1">
          <i data-lucide="calendar" class="w-3 h-3"></i> ${t.data}
        </div>
      `;

      const colunaDestino = document.getElementById(divId);
      if (colunaDestino) colunaDestino.appendChild(card);
    });

    document.getElementById("count-todo").innerText = cTodo;
    document.getElementById("count-doing").innerText = cDoing;
    document.getElementById("count-done").innerText = cDone;

    lucide.createIcons();
  }

  // --- FUNÇÕES DE DRAG AND DROP ---
  function dragStart(event, linha) {
    event.dataTransfer.setData("linha", linha);
    event.target.classList.add("opacity-50"); // Efeito visual de que está a ser arrastado
  }

  function allowDrop(event) {
    event.preventDefault(); // Necessário para permitir o drop
  }

  function dropTarefa(event, novoStatus) {
    event.preventDefault();
    const linha = event.dataTransfer.getData("linha");
    const cardElement = document.getElementById("card-" + linha);

    if (cardElement) {
      cardElement.classList.remove("opacity-50");

      // Atualiza visualmente na hora (pra parecer rápido pro usuário)
      document.getElementById("col-" + novoStatus).appendChild(cardElement);

      // Atualiza a memória local
      const t = tarefasGlobais.find(
        (x) => x.linha.toString() === linha.toString(),
      );
      if (t) t.status = novoStatus;

      // Recalcula contadores
      renderizarQuadro();

      // Envia para o servidor no background
      google.script.run.atualizarStatusTarefa(linha, novoStatus);
    }
  }

  // --- MODAL CRIAR/EDITAR ---
  function abrirModalTarefa() {
    document.getElementById("tar-linha").value = "";
    document.getElementById("tar-titulo").value = "";
    document.getElementById("tar-descricao").value = "";
    document.getElementById("titulo-modal-tarefa").innerText = "Novo Cartão";
    document.getElementById("btn-excluir-tarefa").classList.add("hidden");
    document.getElementById("modal-tarefa").classList.remove("hidden");
  }

  function editarTarefa(linha) {
    const t = tarefasGlobais.find((x) => x.linha === linha);
    if (!t) return;

    document.getElementById("tar-linha").value = t.linha;
    document.getElementById("tar-titulo").value = t.titulo;
    document.getElementById("tar-descricao").value = t.descricao;
    document.getElementById("titulo-modal-tarefa").innerText = "Editar Cartão";
    document.getElementById("btn-excluir-tarefa").classList.remove("hidden");
    document.getElementById("modal-tarefa").classList.remove("hidden");
  }

  function fecharModalTarefa() {
    document.getElementById("modal-tarefa").classList.add("hidden");
  }

  function salvarTarefa() {
    const obj = {
      linha: document.getElementById("tar-linha").value,
      titulo: document.getElementById("tar-titulo").value.trim(),
      descricao: document.getElementById("tar-descricao").value.trim(),
    };

    if (!obj.titulo) {
      mostrarToast("O título do cartão é obrigatório.", "erro");
      return;
    }

    fecharModalTarefa();
    mostrarToast("Salvando cartão...", "info");

    google.script.run
      .withSuccessHandler((res) => {
        if (res.sucesso) {
          carregarQuadroKanban(); // Atualiza a tela puxando do banco
        } else {
          mostrarToast(res.mensagem, "erro");
        }
      })
      .salvarTarefaNoServidor(obj);
  }

  function excluirTarefa() {
    const linha = document.getElementById("tar-linha").value;
    if (confirm("Deseja apagar este cartão definitivamente?")) {
      fecharModalTarefa();
      mostrarToast("Apagando cartão...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          if (res.sucesso) carregarQuadroKanban();
        })
        .excluirTarefaBackend(linha);
    }
  }
</script>
