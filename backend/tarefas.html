<section id="view-tarefas" class="page-view hidden h-full flex flex-col">
  <div class="flex justify-between items-center mb-6 shrink-0">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Quadro de Processos</h2>
      <p class="text-slate-500 text-sm">
        Arraste os cartões para avançar as etapas.
      </p>
    </div>
    <div class="flex gap-2">
      <button
        onclick="abrirModalStatus()"
        class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-300 shadow-sm flex items-center gap-2"
      >
        <i data-lucide="settings-2" class="w-4 h-4"></i> Status
      </button>
      <button
        onclick="abrirModalTarefa()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 shadow-md flex items-center gap-2"
      >
        <i data-lucide="plus" class="w-4 h-4"></i> Novo Cartão
      </button>
    </div>
  </div>

  <div
    id="kanban-colunas"
    class="flex gap-6 overflow-x-auto pb-4 flex-1 items-start"
  ></div>
</section>

<div
  id="modal-status"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10005] flex items-center justify-center backdrop-blur-sm p-4"
>
  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative">
    <h3 class="text-xl font-bold text-slate-800 mb-1">Gerenciar Colunas</h3>
    <p class="text-xs text-slate-500 mb-4">
      Adicione, altere ou remova as colunas do seu quadro. A ordem salva será a
      ordem da tela.
    </p>

    <div
      id="lista-inputs-status"
      class="space-y-2 max-h-[40vh] overflow-y-auto mb-4 p-3 border border-slate-100 rounded-lg bg-slate-50"
    ></div>

    <button
      onclick="adicionarInputStatus()"
      class="text-sm font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1 mb-6"
    >
      <i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar nova etapa
    </button>

    <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
      <button
        onclick="fecharModalStatus()"
        class="bg-slate-100 px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200"
      >
        Cancelar
      </button>
      <button
        onclick="salvarNovosStatus()"
        class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-white shadow-md hover:bg-blue-700"
      >
        Salvar Ordem
      </button>
    </div>
  </div>
</div>

<div
  id="modal-tarefa"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10005] flex items-center justify-center backdrop-blur-sm p-4"
>
  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative">
    <h3 id="titulo-modal-tarefa" class="text-xl font-bold text-slate-800 mb-4">
      Novo Cartão
    </h3>
    <input type="hidden" id="tar-linha" />

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Título / Processo</label
        >
        <input
          type="text"
          id="tar-titulo"
          class="input-field font-bold text-slate-800"
          placeholder="Ex: Solicitar inversor para o cliente X"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Descrição Detalhada</label
        >
        <textarea
          id="tar-descricao"
          rows="4"
          class="input-field resize-none text-sm"
          placeholder="Anotações, links, ou detalhes do processo..."
        ></textarea>
      </div>
    </div>

    <div
      class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100"
    >
      <button
        id="btn-excluir-tarefa"
        onclick="excluirTarefa()"
        class="text-red-500 hover:bg-red-50 p-2 rounded transition-colors hidden"
        title="Excluir Cartão"
      >
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>

      <div class="flex gap-2 ml-auto">
        <button
          onclick="fecharModalTarefa()"
          class="bg-slate-100 px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200"
        >
          Cancelar
        </button>
        <button
          onclick="salvarTarefa()"
          class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-white shadow-md hover:bg-blue-700"
        >
          Salvar Cartão
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let tarefasGlobais = [];
  let colunasGlobais = []; // Guarda os status dinâmicos do banco

  function carregarQuadroKanban() {
    mostrarToast("Carregando quadro...", "info");
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          tarefasGlobais = res.dados;
          colunasGlobais = res.colunas;
          renderizarQuadro();
        } else {
          mostrarToast(
            "Erro ao carregar: " + (res ? res.mensagem : "Falha na conexão"),
            "erro",
          );
        }
      })
      .withFailureHandler((err) => {
        mostrarToast("Erro crítico de comunicação: " + err.message, "erro");
      })
      .obterTarefas();
  }

  function renderizarQuadro() {
    const container = document.getElementById("kanban-colunas");
    container.innerHTML = "";

    // 1. GERA AS COLUNAS DINAMICAMENTE
    colunasGlobais.forEach((colNome, index) => {
      const qtd = tarefasGlobais.filter((t) => t.status === colNome).length;

      // Lógica visual: Primeira coluna (Cinza), Meio (Azul), Última (Verde)
      let corBg = "bg-blue-50 border-blue-100";
      let corHeader = "bg-blue-100/50 border-blue-100 text-blue-800";
      let corBadge = "bg-blue-200 text-blue-800";

      if (index === 0) {
        corBg = "bg-slate-100 border-slate-200";
        corHeader = "bg-slate-200/50 border-slate-200 text-slate-700";
        corBadge = "bg-slate-300 text-slate-700";
      } else if (index === colunasGlobais.length - 1) {
        corBg = "bg-emerald-50 border-emerald-100";
        corHeader = "bg-emerald-100/50 border-emerald-100 text-emerald-800";
        corBadge = "bg-emerald-200 text-emerald-800";
      }

      const colDiv = document.createElement("div");
      colDiv.className = `${corBg} rounded-xl w-80 shrink-0 flex flex-col max-h-full border`;
      colDiv.innerHTML = `
        <div class="p-3 border-b flex justify-between items-center rounded-t-xl ${corHeader}">
          <h3 class="font-bold">${colNome}</h3>
          <span class="${corBadge} text-xs px-2 py-1 rounded-full font-bold">${qtd}</span>
        </div>
        <div id="col-${colNome}" class="p-3 flex-1 overflow-y-auto space-y-3 min-h-[200px]" ondragover="allowDrop(event)" ondrop="dropTarefa(event, '${colNome}')">
        </div>
      `;
      container.appendChild(colDiv);
    });

    // 2. GERA OS CARTÕES E COLOCA NA COLUNA CERTA
    tarefasGlobais.forEach((t) => {
      const card = document.createElement("div");
      card.className =
        "bg-white p-3 rounded-lg shadow-sm border border-slate-200 cursor-grab hover:shadow-md transition-shadow relative group active:cursor-grabbing";
      card.draggable = true;
      card.id = "card-" + t.linha;
      card.ondragstart = (e) => dragStart(e, t.linha);

      card.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <span class="text-[10px] font-mono text-slate-400 font-bold">${t.id}</span>
          <button onclick="editarTarefa(${t.linha})" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-blue-600 transition-opacity">
            <i data-lucide="edit-2" class="w-4 h-4"></i>
          </button>
        </div>
        <h4 class="text-sm font-bold text-slate-800 mb-1 leading-tight">${t.titulo}</h4>
        ${t.descricao ? `<p class="text-xs text-slate-500 line-clamp-2">${t.descricao}</p>` : ""}
        <div class="mt-3 text-[10px] text-slate-400 font-medium flex items-center gap-1">
          <i data-lucide="calendar" class="w-3 h-3"></i> ${t.data}
        </div>
      `;

      const colunaDestino = document.getElementById("col-" + t.status);
      if (colunaDestino) colunaDestino.appendChild(card);
    });

    lucide.createIcons();
  }

  // --- FUNÇÕES DE STATUS ---
  function abrirModalStatus() {
    const container = document.getElementById("lista-inputs-status");
    container.innerHTML = "";
    colunasGlobais.forEach((col) => adicionarInputStatus(col));
    document.getElementById("modal-status").classList.remove("hidden");
    lucide.createIcons();
  }

  function fecharModalStatus() {
    document.getElementById("modal-status").classList.add("hidden");
  }

  function adicionarInputStatus(valor = "") {
    const container = document.getElementById("lista-inputs-status");
    const div = document.createElement("div");
    div.className = "flex gap-2 items-center group";
    div.innerHTML = `
      <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300"></i>
      <input type="text" class="input-status flex-1 p-2 border border-slate-300 rounded outline-none uppercase font-bold text-sm text-slate-700 bg-white" value="${valor}" placeholder="NOME DO STATUS" />
      <button onclick="this.parentElement.remove()" class="text-red-300 hover:text-red-600 p-1 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
    `;
    container.appendChild(div);
    lucide.createIcons();
  }

  function salvarNovosStatus() {
    const inputs = document.querySelectorAll(".input-status");
    const novosStatus = [];

    inputs.forEach((inp) => {
      if (inp.value.trim() !== "")
        novosStatus.push(inp.value.trim().toUpperCase());
    });

    if (novosStatus.length === 0) {
      mostrarToast("Você precisa ter pelo menos 1 coluna de status!", "erro");
      return;
    }

    fecharModalStatus();
    mostrarToast("Salvando colunas...", "info");

    google.script.run
      .withSuccessHandler((res) => {
        if (res.sucesso) {
          carregarQuadroKanban();
          mostrarToast("Colunas atualizadas!", "sucesso");
        } else {
          mostrarToast("Erro: " + res.mensagem, "erro");
        }
      })
      .salvarStatusTarefas(novosStatus);
  }

  // --- FUNÇÕES DE DRAG AND DROP ---
  function dragStart(event, linha) {
    event.dataTransfer.setData("linha", linha);
    event.target.classList.add("opacity-50");
  }

  function allowDrop(event) {
    event.preventDefault();
  }

  function dropTarefa(event, novoStatus) {
    event.preventDefault();
    const linha = event.dataTransfer.getData("linha");
    const cardElement = document.getElementById("card-" + linha);

    if (cardElement) {
      cardElement.classList.remove("opacity-50");
      document.getElementById("col-" + novoStatus).appendChild(cardElement);

      const t = tarefasGlobais.find(
        (x) => x.linha.toString() === linha.toString(),
      );
      if (t) t.status = novoStatus;

      renderizarQuadro(); // Atualiza a contagem dos números
      google.script.run.atualizarStatusTarefa(linha, novoStatus);
    }
  }

  // --- FUNÇÕES DE TAREFAS ---
  function abrirModalTarefa() {
    document.getElementById("tar-linha").value = "";
    document.getElementById("tar-titulo").value = "";
    document.getElementById("tar-descricao").value = "";
    document.getElementById("titulo-modal-tarefa").innerText = "Novo Cartão";
    document.getElementById("btn-excluir-tarefa").classList.add("hidden");
    document.getElementById("modal-tarefa").classList.remove("hidden");
  }

  function editarTarefa(linha) {
    const t = tarefasGlobais.find((x) => x.linha === linha);
    if (!t) return;

    document.getElementById("tar-linha").value = t.linha;
    document.getElementById("tar-titulo").value = t.titulo;
    document.getElementById("tar-descricao").value = t.descricao;
    document.getElementById("titulo-modal-tarefa").innerText = "Editar Cartão";
    document.getElementById("btn-excluir-tarefa").classList.remove("hidden");
    document.getElementById("modal-tarefa").classList.remove("hidden");
  }

  function fecharModalTarefa() {
    document.getElementById("modal-tarefa").classList.add("hidden");
  }

  function salvarTarefa() {
    const obj = {
      linha: document.getElementById("tar-linha").value,
      titulo: document.getElementById("tar-titulo").value.trim(),
      descricao: document.getElementById("tar-descricao").value.trim(),
    };

    if (!obj.titulo) {
      mostrarToast("O título do cartão é obrigatório.", "erro");
      return;
    }

    fecharModalTarefa();
    mostrarToast("Salvando cartão...", "info");

    google.script.run
      .withSuccessHandler((res) => {
        if (res.sucesso) carregarQuadroKanban();
        else mostrarToast(res.mensagem, "erro");
      })
      .salvarTarefaNoServidor(obj);
  }

  function excluirTarefa() {
    const linha = document.getElementById("tar-linha").value;
    if (confirm("Deseja apagar este cartão definitivamente?")) {
      fecharModalTarefa();
      mostrarToast("Apagando cartão...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          if (res.sucesso) carregarQuadroKanban();
        })
        .excluirTarefaBackend(linha);
    }
  }
</script>
