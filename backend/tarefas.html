<section id="view-tarefas" class="page-view">
  <div class="flex flex-col h-full">
    <!-- Cabeçalho e Seletores de Quadro -->
    <div class="mb-6">
      <div
        class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4"
      >
        <div>
          <h2 class="text-2xl font-bold text-slate-800">
            Quadros de Produção (Kanban)
          </h2>
          <p class="text-slate-500 text-sm">
            Gerencie etapas de obras, pendências e pós-venda.
          </p>
        </div>
        <button
          onclick="abrirModalTarefa()"
          class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition-all flex items-center gap-2"
        >
          <i data-lucide="plus" class="w-5 h-5"></i> Novo Cartão
        </button>
      </div>

      <!-- Navegação em Abas (Quadros) -->
      <div
        class="flex gap-2 border-b border-slate-200 overflow-x-auto pb-px"
        id="abas-quadros"
      >
        <button
          onclick="mudarQuadroKanban('PROJETOS')"
          id="btn-quadro-PROJETOS"
          class="px-4 py-2 font-bold text-sm border-b-2 border-purple-600 text-purple-600 whitespace-nowrap"
        >
          <i data-lucide="sun" class="w-4 h-4 inline-block mr-1 mb-0.5"></i>
          Obras & Projetos
        </button>
        <button
          onclick="mudarQuadroKanban('AGENDA')"
          id="btn-quadro-AGENDA"
          class="px-4 py-2 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-purple-600 whitespace-nowrap transition-colors"
        >
          <i
            data-lucide="calendar"
            class="w-4 h-4 inline-block mr-1 mb-0.5"
          ></i>
          Agenda
        </button>
        <button
          onclick="mudarQuadroKanban('POS-VENDA')"
          id="btn-quadro-POS-VENDA"
          class="px-4 py-2 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-purple-600 whitespace-nowrap transition-colors"
        >
          <i
            data-lucide="headphones"
            class="w-4 h-4 inline-block mr-1 mb-0.5"
          ></i>
          Pós-Venda
        </button>
        <button
          onclick="mudarQuadroKanban('GERAL')"
          id="btn-quadro-GERAL"
          class="px-4 py-2 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-purple-600 whitespace-nowrap transition-colors"
        >
          <i data-lucide="layout" class="w-4 h-4 inline-block mr-1 mb-0.5"></i>
          Geral
        </button>
      </div>
    </div>
  </div>

  <!-- Área do Kanban -->
  <div class="flex-1 overflow-x-auto pb-4">
    <div id="kanban-board" class="flex gap-4 min-h-[60vh] h-full items-start">
      <!-- Colunas geradas dinamicamente -->
      <div
        class="w-80 shrink-0 bg-slate-100 rounded-xl p-4 flex flex-col h-full animate-pulse"
      >
        <div class="h-4 bg-slate-200 rounded w-1/2 mb-4"></div>
        <div class="h-24 bg-slate-200 rounded mb-3"></div>
        <div class="h-24 bg-slate-200 rounded"></div>
      </div>
    </div>
  </div>
</section>

<!-- Modal de Nova Tarefa / Edição -->
<div
  id="modal-tarefa"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10002] flex items-center justify-center backdrop-blur-sm p-4"
>
  <div
    class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]"
  >
    <div class="flex justify-between items-center mb-4 border-b pb-3 shrink-0">
      <h3
        class="text-xl font-bold text-slate-800 flex items-center gap-2"
        id="titulo-modal-tarefa"
      >
        <i data-lucide="file-text" class="w-5 h-5 text-purple-600"></i> Criar
        Cartão
      </h3>
      <button
        onclick="fecharModalTarefa()"
        class="text-slate-400 hover:text-red-500 transition-colors"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <input type="hidden" id="tar-linha" />

    <div class="overflow-y-auto flex-1 pr-2 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Quadro de Destino</label
        >
        <select
          id="tar-quadro"
          class="input-field bg-slate-50 font-bold text-purple-700"
        >
          <option value="PROJETOS">Obras & Projetos</option>
          <option value="AGENDA">Agenda</option>
          <option value="POS-VENDA">Pós-Venda</option>
          <option value="GERAL">Geral</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Título do Cartão</label
        >
        <input
          type="text"
          id="tar-titulo"
          class="input-field font-bold"
          placeholder="Ex: Instalação Cliente X"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Descrição / Detalhes</label
        >
        <textarea
          id="tar-descricao"
          rows="3"
          class="input-field resize-none"
          placeholder="Observações e pendências..."
        ></textarea>
      </div>

      <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
        <label class="block text-xs font-bold text-blue-700 uppercase mb-2">
          <i
            data-lucide="paperclip"
            class="w-3.5 h-3.5 inline-block mb-0.5"
          ></i>
          Anexar Documento ou Imagem
        </label>
        <input
          type="file"
          id="tar-arquivo"
          class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition-colors"
        />
        <p class="text-[10px] text-slate-400 mt-1 pl-1">
          * Será guardado automaticamente no Google Drive
        </p>
      </div>
    </div>

    <div class="flex gap-3 pt-4 border-t border-slate-100 shrink-0 mt-4">
      <button
        onclick="fecharModalTarefa()"
        class="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors"
      >
        Cancelar
      </button>
      <button
        onclick="salvarCartaoTarefa()"
        id="btn-salvar-tarefa"
        class="flex-1 bg-purple-600 py-3 rounded-xl font-bold text-white shadow-lg hover:bg-purple-700 transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="save" class="w-5 h-5"></i> Salvar Cartão
      </button>
    </div>
  </div>
</div>

<script>
  let tarefasGlobais = [];
  let colunasGlobais = [];
  let quadroAtivo = "PROJETOS"; // Quadro padrão inicial

  function carregarQuadroKanban() {
    document.getElementById("kanban-board").innerHTML = `
      <div class="w-80 shrink-0 bg-slate-100 rounded-xl p-4 flex flex-col h-full animate-pulse">
        <div class="h-4 bg-slate-200 rounded w-1/2 mb-4"></div>
        <div class="h-24 bg-slate-200 rounded mb-3"></div>
      </div>
    `;

    google.script.run
      .withSuccessHandler((res) => {
        if (res.sucesso) {
          tarefasGlobais = res.dados;
          colunasGlobais = res.colunas;
          renderizarKanban();
        } else {
          mostrarToast("Erro ao carregar Kanban: " + res.mensagem, "erro");
        }
      })
      .obterTarefas();
  }

  window.mudarQuadroKanban = function (nomeQuadro) {
    quadroAtivo = nomeQuadro;

    // Atualiza a interface visual das abas
    const abas = ["PROJETOS", "AGENDA", "POS-VENDA", "GERAL"];
    abas.forEach((aba) => {
      const btn = document.getElementById("btn-quadro-" + aba);
      if (btn) {
        if (aba === quadroAtivo) {
          btn.className =
            "px-4 py-2 font-bold text-sm border-b-2 border-purple-600 text-purple-600 whitespace-nowrap";
        } else {
          btn.className =
            "px-4 py-2 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-purple-600 whitespace-nowrap transition-colors";
        }
      }
    });

    // Se o modal estiver aberto (ou quando for abrir), muda o select padrão
    const selectQuadro = document.getElementById("tar-quadro");
    if (selectQuadro) selectQuadro.value = quadroAtivo;

    renderizarKanban();
  };

  function renderizarKanban() {
    const board = document.getElementById("kanban-board");
    board.innerHTML = "";

    // Filtra tarefas apenas do quadro ativo
    const tarefasDoQuadro = tarefasGlobais.filter(
      (t) => t.quadro === quadroAtivo,
    );

    colunasGlobais.forEach((colunaNome) => {
      const colDiv = document.createElement("div");
      colDiv.className =
        "w-80 shrink-0 bg-slate-100 rounded-xl flex flex-col max-h-full border border-slate-200/60 shadow-sm";

      let headerColor = "border-slate-300 text-slate-700";
      if (colunaNome === "A FAZER")
        headerColor = "border-amber-400 text-amber-700";
      if (colunaNome === "EM ANDAMENTO")
        headerColor = "border-blue-400 text-blue-700";
      if (colunaNome === "CONCLUÍDO")
        headerColor = "border-emerald-400 text-emerald-700";

      colDiv.innerHTML = `
        <div class="p-3 border-b-2 ${headerColor} flex justify-between items-center bg-white/50 rounded-t-xl shrink-0">
          <h4 class="font-bold text-sm uppercase tracking-wider">${colunaNome}</h4>
          <span class="bg-white px-2 py-0.5 rounded-full text-xs font-bold text-slate-400 shadow-sm border border-slate-100">
            ${tarefasDoQuadro.filter((t) => t.status === colunaNome).length}
          </span>
        </div>
        <div class="p-3 flex-1 overflow-y-auto space-y-3 dropzone" data-status="${colunaNome}"></div>
      `;

      const zonaCartoes = colDiv.querySelector(".dropzone");

      tarefasDoQuadro.forEach((tar) => {
        if (tar.status === colunaNome) {
          const card = document.createElement("div");
          card.className =
            "bg-white p-3.5 rounded-lg shadow-sm border border-slate-200 hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing group";

          let htmlAnexos = "";
          if (tar.anexos && tar.anexos.length > 0) {
            htmlAnexos = `<div class="mt-2 pt-2 border-t border-slate-100 flex gap-2">
              <a href="${tar.anexos[0].url}" target="_blank" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold hover:bg-blue-100 flex items-center gap-1">
                <i data-lucide="paperclip" class="w-3 h-3"></i> 1 Anexo
              </a>
            </div>`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-start mb-1">
              <span class="text-[10px] font-bold text-slate-400">#${tar.linha}</span>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="prepararEdicaoTarefa(${tar.linha})" class="text-blue-500 hover:bg-blue-50 p-1 rounded"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
                <button onclick="moverCartaoKanban(${tar.linha}, '${colunaNome}')" class="text-emerald-500 hover:bg-emerald-50 p-1 rounded"><i data-lucide="arrow-right" class="w-3 h-3"></i></button>
                <button onclick="deletarTarefa(${tar.linha})" class="text-red-400 hover:bg-red-50 p-1 rounded"><i data-lucide="trash" class="w-3 h-3"></i></button>
              </div>
            </div>
            <h5 class="font-bold text-slate-800 text-sm mb-1 leading-tight">${tar.titulo}</h5>
            ${tar.descricao ? `<p class="text-xs text-slate-500 line-clamp-2">${tar.descricao}</p>` : ""}
            ${htmlAnexos}
          `;
          zonaCartoes.appendChild(card);
        }
      });

      board.appendChild(colDiv);
    });
    lucide.createIcons();
  }

  // Avança o status do cartão para a próxima coluna
  window.moverCartaoKanban = function (linha, statusAtual) {
    const currentIndex = colunasGlobais.indexOf(statusAtual);
    if (currentIndex < colunasGlobais.length - 1) {
      const novoStatus = colunasGlobais[currentIndex + 1];
      mostrarToast("A mover cartão...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          if (res.sucesso) carregarQuadroKanban();
        })
        .atualizarStatusTarefa(linha, novoStatus);
    } else {
      mostrarToast("O cartão já está na última fase.", "info");
    }
  };

  window.abrirModalTarefa = function () {
    document.getElementById("tar-linha").value = "";
    document.getElementById("tar-titulo").value = "";
    document.getElementById("tar-descricao").value = "";
    document.getElementById("tar-arquivo").value = "";
    document.getElementById("tar-quadro").value = quadroAtivo; // Associa ao quadro atual

    document.getElementById("titulo-modal-tarefa").innerHTML =
      `<i data-lucide="file-text" class="w-5 h-5 text-purple-600"></i> Criar Cartão`;
    document.getElementById("modal-tarefa").classList.remove("hidden");
    lucide.createIcons();
  };

  window.fecharModalTarefa = function () {
    document.getElementById("modal-tarefa").classList.add("hidden");
  };

  window.prepararEdicaoTarefa = function (linha) {
    const t = tarefasGlobais.find((x) => x.linha === linha);
    if (!t) return;

    document.getElementById("tar-linha").value = t.linha;
    document.getElementById("tar-titulo").value = t.titulo;
    document.getElementById("tar-descricao").value = t.descricao;
    document.getElementById("tar-quadro").value = t.quadro || "GERAL";
    document.getElementById("tar-arquivo").value = "";

    document.getElementById("titulo-modal-tarefa").innerHTML =
      `<i data-lucide="edit-3" class="w-5 h-5 text-amber-500"></i> Editar Cartão`;
    document.getElementById("modal-tarefa").classList.remove("hidden");
    lucide.createIcons();
  };

  window.salvarCartaoTarefa = function () {
    const titulo = document.getElementById("tar-titulo").value.trim();
    if (!titulo) return mostrarToast("O título é obrigatório.", "erro");

    const fileInput = document.getElementById("tar-arquivo");
    const obj = {
      linha: document.getElementById("tar-linha").value,
      titulo: titulo,
      descricao: document.getElementById("tar-descricao").value.trim(),
      quadro: document.getElementById("tar-quadro").value, // Grava o quadro escolhido
    };

    const btn = document.getElementById("btn-salvar-tarefa");
    btn.innerHTML = "A processar...";
    btn.disabled = true;

    if (fileInput.files.length > 0) {
      const f = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const d = e.target.result;
        const b64 = d.split(",")[1];
        obj.arquivo = { nome: f.name, mimeType: f.type, base64: b64 };
        enviarTarefaParaServidor(obj, btn);
      };
      reader.readAsDataURL(f);
    } else {
      enviarTarefaParaServidor(obj, btn);
    }
  };

  function enviarTarefaParaServidor(obj, btn) {
    google.script.run
      .withSuccessHandler((res) => {
        btn.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> Salvar Cartão`;
        btn.disabled = false;
        if (res.sucesso) {
          mostrarToast("Cartão guardado!");
          fecharModalTarefa();

          // Se o utilizador criou para um quadro diferente do que está a ver, muda para ele automaticamente
          if (obj.quadro !== quadroAtivo) mudarQuadroKanban(obj.quadro);
          else carregarQuadroKanban();
        } else {
          mostrarToast(res.mensagem, "erro");
        }
      })
      .salvarTarefaNoServidor(obj);
  }

  window.deletarTarefa = function (linha) {
    if (!confirm("Excluir este cartão definitivamente?")) return;
    mostrarToast("Excluindo...", "info");
    google.script.run
      .withSuccessHandler((res) => {
        if (res.sucesso) carregarQuadroKanban();
      })
      .excluirTarefaBackend(linha);
  };
</script>
