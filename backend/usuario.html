<section id="view-usuarios" class="page-view">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-800">Gestão de Usuários</h2>
    <button
      onclick="abrirModalUsuario()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 shadow-md flex items-center gap-2"
    >
      <i data-lucide="user-plus" class="w-4 h-4"></i> Novo Usuário
    </button>
  </div>

  <div class="finance-card">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead>
          <tr class="border-b text-slate-400 text-xs uppercase font-bold">
            <th class="p-3">Nome</th>
            <th class="p-3">Login</th>
            <th class="p-3">Nível</th>
            <th class="p-3">Trocar Senha</th>
            <th class="p-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios-body"></tbody>
      </table>
    </div>
  </div>
</section>

<div
  id="modal-usuario"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10002] flex items-center justify-center backdrop-blur-sm"
>
  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
    <h3 id="modal-usuario-titulo" class="text-xl font-bold text-slate-800 mb-4">
      Novo Usuário
    </h3>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Nome Completo</label
        >
        <input type="text" id="usu-nome" class="input-field" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Login (Acesso)</label
        >
        <input type="text" id="usu-login" class="input-field" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >E-mail</label
        >
        <input
          type="email"
          id="usu-email"
          class="input-field"
          placeholder="exemplo@email.com"
        />
      </div>
      <div id="area-senha">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Senha Inicial</label
        >
        <input
          type="password"
          id="usu-senha"
          class="input-field"
          placeholder="••••••••"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
          >Nível de Acesso</label
        >
        <select id="usu-nivel" class="input-field">
          <option value="COLABORADOR">Colaborador</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="usu-trocar-senha" checked />
        <label for="usu-trocar-senha" class="text-sm text-slate-600 font-medium"
          >Exigir troca de senha no primeiro acesso</label
        >
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button
        onclick="fecharModalUsuario()"
        class="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-slate-600"
      >
        Cancelar
      </button>
      <button
        onclick="salvarUsuario()"
        class="flex-1 bg-blue-600 py-3 rounded-xl font-bold text-white shadow-lg hover:bg-blue-700"
      >
        Salvar
      </button>
    </div>
  </div>
</div>
