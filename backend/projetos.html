<section id="view-projetos" class="page-view">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-800">Lançamento de Vendas</h2>
    <button
      onclick="abrirModalProjeto()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 shadow-md flex items-center gap-2"
    >
      <i data-lucide="plus-circle" class="w-4 h-4"></i> Nova Venda
    </button>
  </div>

  <div class="finance-card">
    <div class="overflow-x-auto">
      <div
        class="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-xl mb-4"
      >
        <div class="relative w-full max-w-md">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
          >
            <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
          </div>
          <input
            type="text"
            id="filtro-projetos"
            onkeyup="filtrarProjetos()"
            class="input-field pl-10 w-full"
            placeholder="Buscar por Cliente ou Status..."
          />
        </div>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="border-b text-slate-400 text-xs uppercase font-bold">
            <th class="p-3">Data</th>
            <th class="p-3">Cliente</th>
            <th class="p-3">Vl. Total</th>
            <th class="p-3">Saldo Líquido</th>
            <th class="p-3 hidden">Status</th>
            <th class="p-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-projetos-body"></tbody>
      </table>
    </div>
  </div>
</section>

<div
  id="modal-projeto"
  class="fixed inset-0 bg-slate-900/80 hidden z-[10002] flex items-center justify-center backdrop-blur-sm p-4"
>
  <div
    class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]"
  >
    <div class="flex justify-between items-center mb-4 shrink-0">
      <h3 class="text-xl font-bold text-slate-800" id="titulo-modal-projeto">
        Cadastrar Venda Solar
      </h3>
      <button
        onclick="fecharModalProjeto()"
        class="text-slate-400 hover:text-red-500 transition-colors"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <input type="hidden" id="proj-linha" />

    <!-- NAVEGAÇÃO DAS ABAS -->
    <div class="flex border-b border-slate-200 mb-6 shrink-0 overflow-x-auto">
      <button
        id="btn-aba-dados"
        onclick="mudarAbaVenda('dados')"
        class="flex-1 pb-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="clipboard-list" class="w-4 h-4"></i> 1. Dados do
        Contrato
      </button>
      <button
        id="btn-aba-custos"
        onclick="mudarAbaVenda('custos')"
        class="flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-blue-500 transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="wrench" class="w-4 h-4"></i> 2. Custos de Execução
      </button>
      <button
        id="btn-aba-financeiro"
        onclick="mudarAbaVenda('financeiro')"
        class="flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-blue-500 transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="pie-chart" class="w-4 h-4"></i> 3. Resumo Financeiro
      </button>
    </div>

    <!-- CONTEÚDO SCROLLÁVEL -->
    <div class="overflow-y-auto flex-1 pr-2 pb-4">
      <!-- ABA 1: DADOS DO CONTRATO -->
      <div id="aba-dados" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-1">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
              >Data da Venda</label
            >
            <input type="date" id="proj-data" class="input-field" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
              >Cliente</label
            >
            <input
              type="text"
              id="proj-cliente"
              list="clientes-list"
              autocomplete="off"
              class="input-field font-bold text-slate-800 uppercase"
              placeholder="Buscar cliente..."
            />
          </div>
        </div>
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-blue-50/50 p-4 rounded-xl border border-blue-100"
        >
          <div>
            <label class="block text-xs font-bold text-blue-700 uppercase mb-1"
              >Valor Total (Contrato)</label
            >
            <input
              type="number"
              id="proj-total"
              class="input-field font-bold border-blue-300 text-lg"
              oninput="calcularRentabilidade()"
              placeholder="R$ 0,00"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-blue-700 uppercase mb-1"
              >Valor do Kit (Fornecedor)</label
            >
            <input
              type="number"
              id="proj-kit"
              class="input-field font-bold border-blue-300 text-lg"
              oninput="calcularRentabilidade()"
              placeholder="R$ 0,00"
            />
          </div>
        </div>
        <div class="hidden">
          <select id="proj-status" class="input-field">
            <option value="AGUARDANDO KIT">Aguardando Kit</option>
          </select>
        </div>
      </div>

      <!-- ABA 2: CUSTOS DE EXECUÇÃO -->
      <div id="aba-custos" class="space-y-6 hidden">
        <div>
          <h4 class="text-sm font-bold text-slate-700 border-b pb-2 mb-3">
            Custos de Engenharia & Instalação
          </h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label
                class="block text-xs font-bold text-slate-500 uppercase mb-1"
                >Projeto / Homologação</label
              >
              <input
                type="number"
                id="proj-engenharia"
                class="input-field"
                oninput="calcularRentabilidade()"
                value="400"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-slate-500 uppercase mb-1"
                >Instalador Principal</label
              >
              <input
                type="number"
                id="proj-mo-instalador"
                class="input-field"
                oninput="calcularRentabilidade()"
                placeholder="R$ 0,00"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-slate-500 uppercase mb-1"
                >Pedreiro / Ajudante</label
              >
              <input
                type="number"
                id="proj-mo-pedreiro"
                class="input-field"
                oninput="calcularRentabilidade()"
                placeholder="R$ 0,00"
              />
            </div>
          </div>
        </div>

        <div>
          <h4 class="text-sm font-bold text-slate-700 border-b pb-2 mb-3">
            Materiais Extras & Logística
          </h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                class="block text-xs font-bold text-slate-500 uppercase mb-1"
                >Materiais Gasto na Obra</label
              >
              <input
                type="number"
                id="proj-materiais"
                class="input-field"
                oninput="calcularRentabilidade()"
                placeholder="Fios, Disjuntores, etc..."
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-slate-500 uppercase mb-1"
                >Frete Estimado</label
              >
              <input
                type="number"
                id="proj-frete-estimado"
                class="input-field bg-slate-50 cursor-not-allowed"
                readonly
              />
            </div>
          </div>
        </div>
      </div>

      <!-- ABA 3: RESUMO FINANCEIRO -->
      <div id="aba-financeiro" class="space-y-4 hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label
              class="flex justify-between items-center text-xs font-bold text-slate-600 mb-1 uppercase"
            >
              <span>Comissão</span>
              <input
                type="checkbox"
                id="check-comissao"
                onchange="calcularRentabilidade()"
                class="w-3 h-3 text-blue-600 rounded"
                checked
              />
            </label>
            <input
              type="text"
              id="proj-comissao"
              readonly
              class="input-field bg-slate-50 text-slate-500 font-medium"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase"
              >Impostos s/ Venda</label
            >
            <input
              type="text"
              id="proj-impostos"
              readonly
              class="input-field bg-slate-50 text-slate-500 font-medium"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase"
              >Taxa Maquininha</label
            >
            <select
              id="select-maquininha"
              onchange="calcularRentabilidade()"
              class="input-field mb-1 bg-white"
            >
              <option value="0">Sem Taxa (0%)</option>
              <option value="6x">Cartão 6x</option>
              <option value="12x" selected>Cartão 12x</option>
              <option value="18x">Cartão 18x</option>
              <option value="21x">Cartão 21x</option>
            </select>
            <input
              type="text"
              id="proj-maquininha-valor"
              readonly
              class="input-field bg-slate-50 text-slate-500 font-medium h-8"
            />
          </div>
        </div>

        <div
          class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 mt-4 flex justify-between items-center"
        >
          <div>
            <h4 class="text-sm font-bold text-emerald-800 uppercase">
              Lucro Líquido Real
            </h4>
            <p class="text-[10px] text-emerald-600">
              Total - Kit - Custos Execução - Taxas
            </p>
          </div>
          <input
            type="text"
            id="proj-liquido"
            class="bg-transparent border-none font-black text-2xl text-emerald-700 outline-none text-right w-1/2"
            readonly
            value="R$ 0,00"
          />
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4 border-t pt-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
              >Valor de Entrada R$</label
            >
            <input
              type="number"
              id="proj-entrada"
              class="input-field font-bold text-blue-600"
              oninput="calcularRentabilidade()"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1"
              >A Receber (Residual)</label
            >
            <input
              type="text"
              id="proj-residual"
              readonly
              class="input-field bg-slate-50 font-bold text-slate-700"
              value="R$ 0,00"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- BOTÕES FIXOS NO RODAPÉ -->
    <div class="flex gap-3 pt-4 border-t border-slate-100 shrink-0 mt-2">
      <button
        onclick="fecharModalProjeto()"
        class="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors"
      >
        Cancelar
      </button>
      <button
        onclick="salvarNovoProjeto()"
        class="flex-1 bg-blue-600 py-3 rounded-xl font-bold text-white shadow-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2"
      >
        <i data-lucide="check-circle" class="w-5 h-5"></i> Salvar Venda
      </button>
    </div>
  </div>
</div>
